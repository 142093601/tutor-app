<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        surface: { 0: '#0a0a0b', 1: '#111113', 2: '#18181b', 3: '#1f1f23', 4: '#27272a' },
                        border: { DEFAULT: '#2e2e32', light: '#3f3f46' },
                        text: { primary: '#fafafa', secondary: '#a1a1aa', muted: '#71717a' },
                        blue: { 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' },
                        violet: { 400: '#a78bfa', 500: '#8b5cf6' },
                        emerald: { 400: '#34d399', 500: '#10b981' },
                        amber: { 400: '#fbbf24', 500: '#f59e0b' },
                        rose: { 400: '#fb7185', 500: '#f43f5e' },
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface-0 text-text-primary min-h-screen font-sans antialiased">

    <!-- Top Bar -->
    <nav class="h-14 border-b border-border flex items-center px-6 justify-between bg-surface-1/80 backdrop-blur-xl sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="relative">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-violet-500 flex items-center justify-center">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                </div>
                <div class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-emerald-400 border-2 border-surface-1"></div>
            </div>
            <div>
                <span class="text-sm font-semibold tracking-tight">Tutor</span>
                <span class="text-xs text-text-muted ml-1.5 hidden sm:inline">智能教学助手</span>
            </div>
        </div>
        <div class="flex items-center gap-1">
            <button id="btn-notes-list" class="h-8 px-3 rounded-md text-xs font-medium text-text-secondary hover:text-text-primary hover:bg-surface-3 transition-colors flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                笔记
            </button>
        </div>
    </nav>

    <main class="max-w-[1400px] mx-auto px-6 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-[380px_1fr] gap-6">

            <!-- ===== LEFT PANEL ===== -->
            <div class="space-y-4">

                <!-- Input Card -->
                <section class="card">
                    <div class="card-header">
                        <div class="flex items-center gap-2">
                            <div class="w-1.5 h-1.5 rounded-full bg-blue-500"></div>
                            <span class="text-xs font-medium text-text-secondary uppercase tracking-wider">输入</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <textarea id="input-content"
                            class="input-area h-44"
                            placeholder="粘贴教学文档内容..."></textarea>
                        <label class="mt-3 block">
                            <input type="file" id="file-input" accept=".txt,.md,.text" class="hidden">
                            <div class="upload-zone">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                <span>上传文件</span>
                                <span class="text-text-muted">.txt / .md</span>
                            </div>
                        </label>
                    </div>
                </section>

                <!-- Pipeline Card -->
                <section class="card">
                    <div class="card-header">
                        <div class="flex items-center gap-2">
                            <div class="w-1.5 h-1.5 rounded-full bg-violet-500"></div>
                            <span class="text-xs font-medium text-text-secondary uppercase tracking-wider">流程</span>
                        </div>
                    </div>
                    <div class="card-body space-y-2">
                        <!-- Step items -->
                        <div class="step-item" data-step="decompose">
                            <div class="step-check">
                                <input type="checkbox" id="step-decompose" checked>
                                <label for="step-decompose"></label>
                            </div>
                            <div class="step-info">
                                <div class="step-title">知识分解</div>
                                <div class="step-desc">拆解为独立知识点</div>
                            </div>
                            <span id="status-decompose" class="step-status"></span>
                        </div>
                        <div class="step-item" data-step="organize">
                            <div class="step-check">
                                <input type="checkbox" id="step-organize" checked>
                                <label for="step-organize"></label>
                            </div>
                            <div class="step-info">
                                <div class="step-title">知识梳理</div>
                                <div class="step-desc">关联关系 · 重点标注</div>
                            </div>
                            <span id="status-organize" class="step-status"></span>
                        </div>
                        <div class="step-item" data-step="review">
                            <div class="step-check">
                                <input type="checkbox" id="step-review" checked>
                                <label for="step-review"></label>
                            </div>
                            <div class="step-info">
                                <div class="step-title">审核校验</div>
                                <div class="step-desc">纠错 · 补充 · 完善</div>
                            </div>
                            <span id="status-review" class="step-status"></span>
                        </div>

                        <!-- Mode -->
                        <div class="flex items-center gap-4 pt-2 border-t border-border mt-3 pt-3">
                            <label class="mode-option">
                                <input type="radio" name="process-mode" value="auto" checked>
                                <span>全自动</span>
                            </label>
                            <label class="mode-option">
                                <input type="radio" name="process-mode" value="step">
                                <span>分步执行</span>
                            </label>
                        </div>

                        <!-- Actions -->
                        <div class="flex gap-2 pt-2">
                            <button id="btn-process" class="btn-primary flex-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                开始处理
                            </button>
                            <button id="btn-next-step" class="btn-primary flex-1 hidden">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                下一步
                            </button>
                            <button id="btn-stop" class="btn-ghost hidden">停止</button>
                        </div>
                    </div>
                </section>

                <!-- Progress -->
                <section id="progress-panel" class="card hidden">
                    <div class="card-header">
                        <div class="flex items-center gap-2">
                            <div class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></div>
                            <span class="text-xs font-medium text-text-secondary uppercase tracking-wider">进度</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="progress-log" class="font-mono text-xs text-text-muted space-y-1 max-h-28 overflow-y-auto"></div>
                    </div>
                </section>
            </div>

            <!-- ===== RIGHT PANEL ===== -->
            <div class="space-y-4">

                <!-- Note Preview -->
                <section class="card flex flex-col min-h-[560px]">
                    <div class="card-header">
                        <div class="flex items-center justify-between w-full">
                            <div class="flex items-center gap-2">
                                <div class="w-1.5 h-1.5 rounded-full bg-emerald-500"></div>
                                <span class="text-xs font-medium text-text-secondary uppercase tracking-wider">笔记</span>
                                <span id="word-count" class="text-[11px] text-text-muted ml-1"></span>
                            </div>
                            <div class="flex items-center gap-0.5">
                                <button id="btn-edit" class="btn-icon" title="编辑">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                </button>
                                <button id="btn-save" class="btn-icon hidden" title="Ctrl+S">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                                </button>
                                <div class="w-px h-4 bg-border mx-1"></div>
                                <button id="btn-export-md" class="btn-icon" title="导出 Markdown">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                </button>
                                <button id="btn-export-html" class="btn-icon" title="导出 HTML">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body flex-1 overflow-y-auto">
                        <div id="note-preview" class="prose-custom">
                            <div class="empty-state">
                                <div class="empty-icon">
                                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                </div>
                                <p class="text-sm text-text-secondary">粘贴文档，开始处理</p>
                                <p class="text-xs text-text-muted mt-2">Ctrl+Enter · Ctrl+S · Esc</p>
                            </div>
                        </div>
                        <textarea id="note-editor" class="input-area h-full font-mono text-sm hidden" spellcheck="false"></textarea>
                    </div>
                </section>

                <!-- Chat -->
                <section class="card">
                    <div class="card-header">
                        <div class="flex items-center justify-between w-full">
                            <div class="flex items-center gap-2">
                                <div class="w-1.5 h-1.5 rounded-full bg-amber-500"></div>
                                <span class="text-xs font-medium text-text-secondary uppercase tracking-wider">答疑</span>
                            </div>
                            <button id="btn-clear-chat" class="btn-icon text-text-muted" title="清空对话">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                    <div id="chat-messages" class="px-4 py-3 max-h-64 overflow-y-auto space-y-3">
                        <div class="chat-msg flex gap-3">
                            <div class="chat-avatar bg-gradient-to-br from-blue-500 to-violet-500">T</div>
                            <div class="chat-bubble-ai">
                                你好，处理完文档后可以随时提问。
                            </div>
                        </div>
                    </div>
                    <div class="p-3 border-t border-border">
                        <div id="selected-text-preview" class="hidden mb-2 px-3 py-1.5 bg-blue-500/10 rounded-md text-xs border border-blue-500/20">
                            <span class="text-blue-400 font-medium">选中：</span>
                            <span id="selected-text-content" class="text-text-secondary"></span>
                            <button id="btn-clear-selection" class="float-right text-text-muted hover:text-text-primary">✕</button>
                        </div>
                        <div class="flex gap-2">
                            <input id="chat-input" type="text" class="input-chat flex-1" placeholder="输入问题...">
                            <button id="btn-send" class="btn-send">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                            </button>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- Notes Modal -->
    <div id="notes-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="flex items-center justify-between px-5 py-4 border-b border-border">
                <span class="text-sm font-semibold">笔记列表</span>
                <div class="flex items-center gap-3">
                    <input id="notes-search" type="text" class="input-search" placeholder="搜索...">
                    <button id="btn-close-modal" class="text-text-muted hover:text-text-primary transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            </div>
            <div id="notes-list" class="p-4 overflow-y-auto max-h-[60vh] space-y-1">
                <div class="text-center text-text-muted py-12 text-sm">加载中...</div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
